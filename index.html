<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido Ocelotte</title>
    <link rel="stylesheet" href="https://s.pageclip.co/v1/pageclip.css" media="screen">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            color: #ffffff;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            color: #e0e0e0;
        }

        .media-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        img {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.03);
        }

        /* Estilos para el menú de proyectos */
        .projects-menu {
            width: 100%;
            margin-top: 1rem;
        }

        .projects-menu h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #ccc;
            font-weight: 500;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .app-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 150px;
        }

        .app-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .app-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 1rem;
            box-shadow: none;
        }
        
        .app-btn:hover .app-logo {
            transform: scale(1.05);
        }

        .linkedin-badge {
            margin: 2rem 0;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .counter {
            margin-top: 2rem;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .counter:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 1.5rem;
            }
            
            .buttons-container {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ocelotte</h1>
        
        <div class="media-container">
            <img src="media/tenor.gif" alt="dancing pug" width="250">
            
            
            <div class="projects-menu">
                <h2>Mis proyectos hechos con IA</h2>
                <div class="buttons-container">
                    <a href="https://www.oceiros.com/collectahub" target="_blank" class="app-btn">
                        <img src="placeholder.png" alt="Logo CollectaHub" class="app-logo">
                        <span>CollectaHub</span>
                    </a>
                    
                    <a href="https://www.oceiros.com/totalero" target="_blank" class="app-btn">
                        <img src="placeholder.png" alt="Logo Totalero" class="app-logo">
                        <span>Totalero</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
